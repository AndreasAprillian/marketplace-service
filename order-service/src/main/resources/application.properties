quarkus.application.name=order-service

quarkus.http.port=8082
quarkus.http.host=localhost

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marketplace-db
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=BearerAuth
quarkus.swagger-ui.always-include=true

kafka.bootstrap.servers=localhost:9092

quarkus.rest-client.customer-api.url=http://localhost:8081

quarkus.kogito.devservices.enabled=false