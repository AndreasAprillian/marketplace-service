quarkus.application.name=notification-service

quarkus.http.port=8084
quarkus.http.host=localhost

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marketplace-db
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

kafka.bootstrap.servers=localhost:9092

mp.messaging.incoming.customer-registered.auto.offset.reset=earliest
mp.messaging.incoming.payment-processed.auto.offset.reset=earliest
mp.messaging.incoming.order-failed.auto.offset.reset=earliest
