quarkus.application.name=customer-service

quarkus.http.port=8081
quarkus.http.host=localhost

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marketplace-db
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

mp.jwt.verify.publickey=loremipsumdolorsitametconsecteturadipiscingelit
mp.jwt.verify.issuer=marketplace
smallrye.jwt.algorithm=HS256

quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=BearerAuth
quarkus.swagger-ui.always-include=true

kafka.bootstrap.servers=localhost:9092